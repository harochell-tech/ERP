name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # Job name is the required status check in branch protection: "ci / build-test".
    name: build-test
    runs-on: ubuntu-24.04   # Docker is available for Testcontainers (PostgreSQL 17).
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_ENVIRONMENT: Test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Rochell.slnx

      - name: Format (whitespace)
        run: dotnet format whitespace Rochell.slnx --verify-no-changes

      - name: Build (warnings are errors)
        run: dotnet build Rochell.slnx -c Release --no-restore

      - name: Test (unit, architecture, PostgreSQL 17 integration)
        run: >
          dotnet test Rochell.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults
          --blame-hang-timeout 5m

      # E-PR18b-10: the web UI in the same required job.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web lint, typecheck, API types in sync, unit tests
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm run check:api
          npm test

      - name: Web build (static export)
        working-directory: web
        run: npm run build

      - name: Web browser journey (Playwright, real API and simulated IdP)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  # E-B03-5: the deployable image must build on every change (it is pushed only by deploy-staging).
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the image (no push)
        run: docker build --pull -t rochell-core:ci .
